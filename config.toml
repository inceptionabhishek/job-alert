[app]
database_path = "data/jobs.db"
log_level = "INFO"
dry_run = false

[http]
timeout_seconds = 20
retries = 2
retry_backoff_seconds = 1.0
user_agent = "PersonalJobAlert/0.1 (personal use)"

[telegram]
enabled = true

[matching]
title_keywords = ["software engineer", "software engineering", "software development engineer", "software dev engineer", "software developer", "sde", "sde1", "sde2", "swe", "backend engineer", "backend software engineer", "backend developer", "frontend engineer", "frontend developer", "front end engineer", "full stack engineer", "fullstack engineer", "full stack developer"]
include_keywords = ["frontend","systems","ui","ai","backend", "distributed systems", "api", "microservices"]
exclude_title_keywords = ["intern", "internship", "director", "manager"]
exclude_keywords = []
skills = ["python", "java", "golang", "go", "c++", "aws", "kubernetes"]
locations = [] # No location restriction at the matching stage.
min_years = 0
max_years_exclusive = 3 # Minimum required experience must be strictly below 3.
allow_unknown_experience = false
minimum_score = 3 # A target role alone qualifies; no mandatory skill/backend keyword.
require_title_keyword = true
allow_unknown_location = true

# Copy and edit any of these examples. Only enabled sources are fetched.
[[sources]]
name = "CRED"
type = "lever"
site = "cred"
company = "CRED"
enabled = true

[[sources]]
name = "Acme sample"
type = "sample"
path = "examples/sample_jobs.json"
enabled = false

[[sources]]
name = "Gushwork"
type = "lever"
site = "gushwork"
company = "Gushwork"
enabled = true

[[sources]]
name = "Safe Security"
type = "lever"
site = "safe"
company = "Safe Security"
enabled = true

[[sources]]
name = "Endor Labs"
type = "greenhouse"
board_token = "endorlabs"
company = "Endor Labs"
enabled = true

[[sources]]
name = "Amazon Jobs"
type = "amazon"
search_queries = ["software"]
country = "" # Empty means all countries.
page_size = 50
max_pages = 20
allow_truncated = true # Check the newest 1,000 results; log if older results are omitted.
enabled = true

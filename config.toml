[app]
database_path = "data/jobs.db"
log_level = "INFO"
dry_run = false

[http]
timeout_seconds = 20
retries = 2
retry_backoff_seconds = 1.0
user_agent = "PersonalJobAlert/0.1 (personal use)"

[telegram]
enabled = true

[matching]
title_keywords = ["Enginner","software engineer","software engineer ii", "sde1","software development engineer ii", "software dev engineer ii", "sde ii", "sde 2", "backend engineer", "backend software engineer", "backend developer"]
include_keywords = ["frontend","systems","ui","ai","backend", "distributed systems", "api", "microservices"]
exclude_title_keywords = ["intern", "internship", "staff", "principal", "director", "manager", "full stack", "full-stack"]
exclude_keywords = []
skills = ["python", "java", "golang", "go", "c++", "aws", "kubernetes"]
locations = ["india", "bengaluru", "bangalore", "hyderabad", "chennai", "pune", "gurugram", "gurgaon", "noida", "delhi", "mumbai"]
min_years = 1
max_years = 5
minimum_score = 4
require_title_keyword = true
allow_unknown_location = false

# Copy and edit any of these examples. Only enabled sources are fetched.
[[sources]]
name = "CRED"
type = "lever"
site = "cred"
company = "CRED"
enabled = true

[[sources]]
name = "Acme sample"
type = "sample"
path = "examples/sample_jobs.json"
enabled = false

[[sources]]
name = "Gushwork"
type = "lever"
site = "gushwork"
company = "Gushwork"
enabled = true

[[sources]]
name = "Safe Security"
type = "lever"
site = "safe"
company = "Safe Security"
enabled = true

[[sources]]
name = "Endor Labs"
type = "greenhouse"
board_token = "endorlabs"
company = "Endor Labs"
enabled = true

[[sources]]
name = "Amazon Jobs"
type = "amazon"
search_queries = ["software development engineer ii", "backend engineer"]
page_size = 50
max_pages = 10
enabled = true

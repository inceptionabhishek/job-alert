[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-job-alert"
version = "0.1.0"
description = "Free-tier-friendly personal job alerts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
job-alert = "job_alert.cli:main"

[tool.setuptools.packages.find]
include = ["job_alert*"]
